[theme]
# HYPECHECK palette: cream page, ink text and controls. Risk colors (red, mustard,
# green) are applied per-element in app/site.py and never used as the UI accent.
primaryColor = "#1A1A1A"
backgroundColor = "#F9F3EC"
secondaryBackgroundColor = "#FBF7F2"
textColor = "#1A1A1A"
font = "sans serif"

[client]
# The pages link to each other through the in-page navigation (app/site.py), so the
# default sidebar page list is hidden.
showSidebarNavigation = false

[server]
# Matches the 25 MB limit stated beside every upload.
maxUploadSize = 25
